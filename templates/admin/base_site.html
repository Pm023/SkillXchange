{% extends "admin/base.html" %}

{% block title %}{{ title }} | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block branding %}
<div id="site-name" style="display: flex; align-items: center; gap: 20px;">
    <a href="{% url 'admin:index' %}" style="text-decoration: none;">
        <h1 style="margin: 0; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
            SKILLXCHANGE MASTER
        </h1>
    </a>
    
    <div style="height: 24px; width: 1px; background: rgba(255,255,255,0.2);"></div>
    
    <a href="{% url 'admin_dashboard' %}" style="
        background: #6366f1;
        color: white;
        padding: 6px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.8rem;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        transition: all 0.3s ease;
    " onmouseover="this.style.background='#4f46e5'; this.style.transform='translateY(-1px)'" onmouseout="this.style.background='#6366f1'; this.style.transform='translateY(0)'">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.707-6.707zM3.37 9L1 11.37V14h2.63L6 11.63V11h-.5a.5.5 0 0 1-.5-.5v-.5h-.5a.5.5 0 0 1-.5-.5v-.5h-.5a.5.5 0 0 1-.5-.5V9z"/>
        </svg>
        OPEN LIVE CONTROL PANEL
    </a>
</div>
{% endblock %}

{% block nav-global %}{% endblock %}
