{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Portal Login - SkillXchange{% endblock %}

{% block extra_css %}
<style>
    .admin-login-card {
        max-width: 450px;
        margin: 5rem auto;
        padding: 3rem;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-glass);
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .admin-logo {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 2rem;
        letter-spacing: -1px;
        margin-bottom: 2rem;
        text-align: center;
        background: linear-gradient(to right, #6366f1, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="admin-login-card animate-up">
        <div class="admin-logo">Admin Server</div>
        <h4 class="text-center mb-4 text-white opacity-75">Secure Administrative Access</h4>
        
        {% if error %}
            <div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger small mb-4">
                <i class="bi bi-shield-lock-fill me-2"></i>{{ error }}
            </div>
        {% endif %}

        <form method="post" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-bold">Admin Username</label>
                <input type="text" name="username" class="form-control bg-dark border-secondary bg-opacity-50 text-white p-3 rounded-3" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small text-uppercase fw-bold">Password</label>
                <input type="password" name="password" class="form-control bg-dark border-secondary bg-opacity-50 text-white p-3 rounded-3" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-lg">Enter Dashboard</button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="{% url 'home' %}" class="text-secondary text-decoration-none small hover-opacity-100 transition-all">
                <i class="bi bi-arrow-left me-1"></i>Back to Website
            </a>
        </div>
    </div>
</div>
{% endblock %}
